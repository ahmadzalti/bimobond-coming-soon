<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BimoBond | Coming Soon</title>
  <meta name="description" content="BimoBond is coming soon.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(0, 200, 255, 0.20),
          transparent 38%
        ),
        radial-gradient(
          circle at 82% 78%,
          rgba(255, 0, 128, 0.18),
          transparent 40%
        ),
        linear-gradient(
          135deg,
          #031018 0%,
          #02050b 45%,
          #09030d 70%,
          #160014 100%
        );

      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 1200px;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 35px 20px 25px;
      position: relative;
      z-index: 2;
    }

    /* LOGO */

    .logo-wrapper {
      width: 210px;
      height: 210px;
      margin-bottom: 12px;

      border-radius: 42px;
      overflow: hidden;

      box-shadow:
        0 0 35px rgba(0, 215, 255, 0.15),
        0 0 45px rgba(255, 0, 128, 0.10);
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* BRAND */

    .brand {
      font-size: clamp(58px, 7vw, 92px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -4px;
      margin-bottom: 34px;
    }

    .brand .bimo {
      color: #ffffff;
    }

    .brand .bond {
      background: linear-gradient(
        90deg,
        #00dfff 0%,
        #168cff 30%,
        #8d4cff 60%,
        #ff1493 100%
      );

      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* COMING SOON BADGE */

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 200px;
      height: 48px;

      padding: 0 28px;

      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 30px;

      background: rgba(255, 255, 255, 0.025);

      color: #c2c8d4;

      font-size: 16px;
      font-weight: 500;
      letter-spacing: 5px;

      margin-bottom: 28px;
    }

    /* HEADLINE */

    h1 {
      font-size: clamp(48px, 6vw, 78px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -2px;

      margin-bottom: 25px;
    }

    .amazing {
      background: linear-gradient(
        90deg,
        #00dfff 0%,
        #168cff 30%,
        #8d4cff 60%,
        #ff1493 100%
      );

      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* DESCRIPTION */

    .description {
      max-width: 850px;

      color: #a9b1c2;

      font-size: clamp(17px, 1.5vw, 21px);
      line-height: 1.65;

      margin-bottom: 38px;
    }

    /* GRADIENT LINE */

    .gradient-line {
      width: 115px;
      height: 4px;

      border-radius: 20px;

      background: linear-gradient(
        90deg,
        #00e5ff,
        #5d7cff,
        #ff1493
      );

      margin-bottom: 30px;

      box-shadow:
        0 0 12px rgba(0, 229, 255, 0.25),
        0 0 12px rgba(255, 20, 147, 0.20);
    }

    /* STAY TUNED */

    .stay-tuned {
      color: #9ca6ba;

      font-size: 16px;
      letter-spacing: 8px;

      margin-bottom: 55px;
    }

    /* FOOTER */

    footer {
      color: #6e778a;
      font-size: 14px;
    }

    /* MOBILE */

    @media (max-width: 768px) {

      .page {
        padding: 25px 18px;
      }

      .logo-wrapper {
        width: 150px;
        height: 150px;
        border-radius: 32px;
      }

      .brand {
        font-size: 54px;
        letter-spacing: -3px;
        margin-bottom: 28px;
      }

      .badge {
        min-width: 175px;
        height: 43px;
        font-size: 13px;
        letter-spacing: 4px;
      }

      h1 {
        font-size: 43px;
      }

      .description {
        font-size: 16px;
        max-width: 600px;
      }

      .stay-tuned {
        font-size: 13px;
        letter-spacing: 6px;
        margin-bottom: 40px;
      }
    }

    @media (max-width: 480px) {

      .logo-wrapper {
        width: 125px;
        height: 125px;
        border-radius: 27px;
      }

      .brand {
        font-size: 44px;
        letter-spacing: -2px;
      }

      h1 {
        font-size: 36px;
      }

      .description {
        font-size: 15px;
      }
    }

  </style>
</head>

<body>

  <main class="page">

    <!-- BimoBond Logo -->
    <div class="logo-wrapper">
      <img src="logo.jpeg" alt="BimoBond Logo">
    </div>

    <!-- BimoBond -->
    <div class="brand">
      <span class="bimo">Bimo</span><span class="bond">Bond</span>
    </div>

    <!-- Coming Soon -->
    <div class="badge">
      COMING SOON
    </div>

    <!-- Main title -->
    <h1>
      Something <span class="amazing">Amazing</span><br>
      Is Coming
    </h1>

    <!-- Description -->
    <p class="description">
      We're building a new social experience designed to bring people closer,
      share moments, and create meaningful connections.
    </p>

    <div class="gradient-line"></div>

    <div class="stay-tuned">
      STAY TUNED
    </div>

    <footer>
      © 2026 BimoBond. All rights reserved.
    </footer>

  </main>

</body>
</html>
