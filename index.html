<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bimobond | Coming Soon</title>
  <meta name="description" content="Bimobond is coming soon.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 229, 255, 0.14), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 128, 0.14), transparent 35%),
        #05070d;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .logo {
      font-size: clamp(42px, 8vw, 86px);
      font-weight: 800;
      letter-spacing: -3px;
      margin-bottom: 25px;
    }

    .logo .bimo {
      color: #ffffff;
    }

    .logo .bond {
      background: linear-gradient(90deg, #00e5ff, #8b5cf6, #ff2d95);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      display: inline-block;
      padding: 9px 20px;
      margin-bottom: 28px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 50px;
      background: rgba(255,255,255,.05);
      color: #b9c1d4;
      font-size: 14px;
      letter-spacing: 3px;
    }

    h1 {
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .gradient-text {
      background: linear-gradient(90deg, #00e5ff, #8b5cf6, #ff2d95);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      max-width: 650px;
      margin: 0 auto 40px;
      color: #9da6b9;
      font-size: 18px;
      line-height: 1.7;
    }

    .line {
      width: 80px;
      height: 3px;
      margin: 0 auto 35px;
      border-radius: 20px;
      background: linear-gradient(90deg, #00e5ff, #ff2d95);
    }

    .coming {
      font-size: 14px;
      color: #7e879a;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    footer {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #525b6e;
      font-size: 13px;
    }

    .glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: .12;
      z-index: 0;
    }

    .glow.one {
      background: #00e5ff;
      top: -250px;
      left: -200px;
    }

    .glow.two {
      background: #ff0080;
      right: -200px;
      bottom: -250px;
    }

    @media (max-width: 600px) {
      .description {
        font-size: 16px;
      }

      .logo {
        letter-spacing: -2px;
      }

      .coming {
        letter-spacing: 4px;
      }
    }
  </style>
</head>

<body>

  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="container">

    <div class="logo">
      <span class="bimo">bimo</span><span class="bond">bond</span>
    </div>

    <div class="badge">COMING SOON</div>

    <h1>
      Something <span class="gradient-text">Amazing</span><br>
      Is Coming
    </h1>

    <p class="description">
      We're building a new social experience designed to bring
      people closer, share moments, and create meaningful connections.
    </p>

    <div class="line"></div>

    <div class="coming">
      STAY TUNED
    </div>

  </main>

  <footer>
    © 2026 Bimobond. All rights reserved.
  </footer>

</body>
</html>
