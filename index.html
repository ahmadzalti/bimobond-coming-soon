<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BimoBond | Coming Soon</title>
  <meta name="description" content="BimoBond is coming soon.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at 15% 18%,
          rgba(0, 210, 255, 0.24),
          transparent 36%
        ),
        radial-gradient(
          circle at 85% 76%,
          rgba(255, 0, 130, 0.22),
          transparent 38%
        ),
        linear-gradient(
          135deg,
          #020b11 0%,
          #02050a 45%,
          #07030b 68%,
          #160014 100%
        );

      overflow-x: hidden;
    }

    .page {
      position: relative;
      z-index: 2;

      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 35px 20px 25px;
    }

    /* ========================================
       LOGO
       ======================================== */

    .logo {
      width: 225px;
      height: auto;

      display: block;

      margin: 0 auto 12px;

      border: none;
      outline: none;
      border-radius: 0;

      box-shadow: none;

      object-fit: contain;
    }

    /* ========================================
       BIMOBOND
       ======================================== */

    .brand {
      display: inline-block;

      font-size: clamp(62px, 7vw, 96px);
      font-weight: 900;
      line-height: 1;

      letter-spacing: -5px;

      margin-bottom: 35px;

      background: linear-gradient(
        90deg,
        #00e5ff 0%,
        #009cff 20%,
        #3768ff 40%,
        #824cff 62%,
        #d72ac8 80%,
        #ff008c 100%
      );

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* ========================================
       COMING SOON
       ======================================== */

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 255px;
      height: 51px;

      padding: 0 32px;

      margin-bottom: 27px;

      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 30px;

      background: rgba(255, 255, 255, 0.025);

      color: #d4d8e1;

      font-size: 17px;
      font-weight: 500;

      letter-spacing: 6px;
    }

    /* ========================================
       MAIN TITLE
       ======================================== */

    h1 {
      font-size: clamp(48px, 6vw, 80px);
      line-height: 1.05;

      font-weight: 900;

      letter-spacing: -3px;

      margin-bottom: 27px;
    }

    .amazing {
      display: inline-block;

      background: linear-gradient(
        90deg,
        #00dfff 0%,
        #008fff 25%,
        #6154ff 50%,
        #a838e6 72%,
        #ff008c 100%
      );

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* ========================================
       DESCRIPTION
       ======================================== */

    .description {
      width: 90%;
      max-width: 900px;

      color: #aeb6c7;

      font-size: clamp(17px, 1.5vw, 21px);
      font-weight: 400;

      line-height: 1.7;

      margin-bottom: 38px;
    }

    /* ========================================
       SMALL GRADIENT LINE
       ======================================== */

    .gradient-line {
      width: 125px;
      height: 4px;

      margin-bottom: 30px;

      border-radius: 20px;

      background: linear-gradient(
        90deg,
        #00e5ff 0%,
        #3877ff 40%,
        #a342df 70%,
        #ff008c 100%
      );

      box-shadow:
        0 0 10px rgba(0, 229, 255, 0.25),
        0 0 10px rgba(255, 0, 140, 0.20);
    }

    /* ========================================
       STAY TUNED
       ======================================== */

    .stay-tuned {
      color: #9da7bb;

      font-size: 16px;
      font-weight: 400;

      letter-spacing: 9px;

      margin-bottom: 55px;
    }

    /* ========================================
       FOOTER
       ======================================== */

    footer {
      color: #70798c;

      font-size: 14px;
      font-weight: 400;
    }

    /* ========================================
       MOBILE
       ======================================== */

    @media (max-width: 768px) {

      .page {
        justify-content: flex-start;
        padding-top: 35px;
      }

      .logo {
        width: 165px;
        margin-bottom: 10px;
      }

      .brand {
        font-size: 58px;
        letter-spacing: -3px;
        margin-bottom: 30px;
      }

      .badge {
        min-width: 195px;
        height: 45px;

        font-size: 13px;
        letter-spacing: 4px;

        margin-bottom: 28px;
      }

      h1 {
        font-size: 44px;
        letter-spacing: -2px;
      }

      .description {
        width: 95%;
        font-size: 16px;
      }

      .stay-tuned {
        font-size: 13px;
        letter-spacing: 6px;
        margin-bottom: 40px;
      }
    }

    @media (max-width: 480px) {

      .page {
        padding: 25px 15px;
      }

      .logo {
        width: 135px;
      }

      .brand {
        font-size: 47px;
        letter-spacing: -2px;
      }

      h1 {
        font-size: 37px;
      }

      .description {
        font-size: 15px;
      }

      .gradient-line {
        width: 95px;
      }
    }

  </style>
</head>

<body>

  <main class="page">

    <!-- LOGO -->
    <img
      src="logo.jpeg"
      alt="BimoBond Logo"
      class="logo"
    >

    <!-- BIMOBOND -->
    <div class="brand">
      BimoBond
    </div>

    <!-- COMING SOON -->
    <div class="badge">
      COMING SOON
    </div>

    <!-- TITLE -->
    <h1>
      Something
      <span class="amazing">Amazing</span>
      <br>
      Is Coming
    </h1>

    <!-- DESCRIPTION -->
    <p class="description">
      We're building a new social experience designed to bring people closer,
      share moments, and create meaningful connections.
    </p>

    <!-- GRADIENT LINE -->
    <div class="gradient-line"></div>

    <!-- STAY TUNED -->
    <div class="stay-tuned">
      STAY TUNED
    </div>

    <!-- FOOTER -->
    <footer>
      © 2026 BimoBond. All rights reserved.
    </footer>

  </main>

</body>
</html>
